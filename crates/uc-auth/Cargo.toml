[package]
name = "uc-auth"
description = "Who sent a request and what it may do: a chain of resolvers (trusted headers, OIDC JWTs, AWS signed requests) behind an axum layer, an Authorizer port (Cedar, remote policy decision point) and an Open Policy Agent client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
async-trait.workspace = true
axum.workspace = true
base64 = "0.22"
chrono.workspace = true
# `CedarAuthorizer`. The extensions policies use for the request context:
# `ipaddr` (`source_ip`) and `datetime` (`request_time`).
cedar-policy = { workspace = true, features = ["datetime", "ipaddr"] }
ipnet = "2"
jsonwebtoken.workspace = true
moka = { version = "0.12", features = ["future"] }
# ES512 (P-521), which `jsonwebtoken` does not verify.
p521 = { version = "0.13", features = ["ecdsa"] }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync"] }
tracing.workspace = true
# The host names of issuers: says when a name has no address.
dns-lookup = "4"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "test-util"] }
tower.workspace = true
