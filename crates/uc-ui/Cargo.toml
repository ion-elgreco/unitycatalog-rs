[package]
name = "uc-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Leptos rebuild of the upstream Unity Catalog OSS web UI"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
uc-client.workspace = true
uc-common.workspace = true

# The protobuf runtime of uc-client's models, for their enum values.
buffa.workspace = true
futures.workspace = true
leptos = { version = "0.7", features = ["csr"] }
leptos_router = "0.7"
gloo-timers = { version = "0.3", features = ["futures"] }
percent-encoding = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = "=0.2.121"
js-sys = "=0.3.98"
wasm-bindgen-futures = "=0.4.71"
console_error_panic_hook = "0.1"
web-sys = { version = "=0.3.98", features = [
    "Clipboard",
    "Document",
    "DomRect",
    "Element",
    "Event",
    "EventTarget",
    "FocusEvent",
    "History",
    "HtmlDocument",
    "HtmlElement",
    "HtmlInputElement",
    "KeyboardEvent",
    "Location",
    "MouseEvent",
    "Navigator",
    "Node",
    "NodeList",
    "Storage",
    "VisibilityState",
    "Window",
] }
