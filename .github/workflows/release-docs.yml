name: release-docs

# On tag push (v*.*.*): the docs site (docs/, mkdocs.yml), built with
# zensical and published with mike to the gh-pages branch, as the tag's
# version and as `latest`, which the site's root opens. Each release adds
# its version next to the earlier ones.
#
# Once, outside this workflow: in the repository's Settings → Pages, set
# "Deploy from a branch" with `gh-pages` and `/ (root)`. The first run of
# this workflow makes the branch.
#
# workflow_dispatch builds the ref it runs on: pick the tag.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

# mike pushes to gh-pages: one run at a time, never cancelled.
concurrency:
  group: gh-pages
  cancel-in-progress: false

permissions: {}

jobs:
  docs:
    name: Publish the docs
    runs-on: ubuntu-latest
    permissions:
      contents: write  # mike pushes the site to gh-pages

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # mike adds to the gh-pages branch of the remote.
          fetch-depth: 0
          persist-credentials: false

      # The token goes into the remote's URL only here, not at checkout
      # (persist-credentials), so that the steps before have none.
      - name: Configure git for mike's push
        env:
          ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          git config user.name "${ACTOR}"
          git config user.email "${ACTOR}@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      # The API reference reads the protos through protoc; Ubuntu's (3.21) does not know
      # `debug_redact`. install-action names protoc 34.x `3.34`.
      - name: Install protoc
        uses: taiki-e/install-action@9534c84618278caac52cb373bb164ed464dbd8af # v2.87.11
        with:
          tool: protoc@3.34

      - name: Resolve release version from tag
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # The docs name the chart, the image and the tarballs of the release.
      - name: Set release version
        uses: ./.github/actions/set-release-version
        with:
          version: ${{ steps.version.outputs.version }}

      - name: Publish the docs
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: just docs-deploy "${VERSION}"
