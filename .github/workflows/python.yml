name: python

# The Python client (python/client/): its linting, its stubs and its tests, which
# run against a uc-server built from this repository, and those marked
# `upstream` against the upstream Java server too.

on:
  merge_group:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded PR runs (pushes, force-pushes). Runs on main finish, since
# a cancelled run skips the cache save that PR runs restore from; a newer main
# push waits for the running one. Release workflows opt out of this — see
# release*.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Default to no permissions; each job opts in to whatever it actually needs.
# Limits the blast radius if a step (or a transitively-pulled action) is ever
# compromised — without this, jobs inherit the org/repo default which is
# usually contents:write and can push tags, labels, releases, etc.
permissions: {}

# The key of rust-cache includes the CARGO_* and RUST* variables: these are
# those of ci.yml, so that the jobs of both share one cache.
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # sccache: compiled crates in the GitHub Actions cache. It does not cache
  # incremental builds, so incremental compilation is off.
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"
  CARGO_INCREMENTAL: "0"
  # [profile.ci] of Cargo.toml, for cargo and the just recipes.
  PROFILE: "ci"

jobs:
  linting:
    name: Python linting (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    strategy:
      matrix:
        python-version: ["3.12", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Environment
        uses: ./.github/actions/setup-env
        with:
          python-version: ${{ matrix.python-version }}
          # lint compiles no Rust; keep it off the Rust cache
          rust-cache: "false"

      - name: setup venv
        run: just venv

      - name: Run linting (ruff, mypy)
        run: just pre-commit-check

  stubs:
    name: Python stubs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: setup venv
        run: just venv

      - name: Stubs are up to date
        run: |
          just generate-stubs
          if [ -n "$(git status --porcelain python/client/unitycatalog/_core)" ]; then
            git status --short python/client/unitycatalog/_core
            git diff python/client/unitycatalog/_core
            echo "The stubs differ from the Rust code: run 'just generate-stubs'." >&2
            exit 1
          fi

  # The four packages as users get them: their wheels, installed into a new
  # venv, from which `uc dev`, `uc web` and the client run.
  packaging:
    name: Python packages
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Build, install and run the packages
        run: just test-packages

  testing:
    name: Python tests (${{ matrix.label }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: linux-glibc-x86_64, runner: ubuntu-latest, python-version: "3.12" }
          - { label: linux-glibc-x86_64, runner: ubuntu-latest, python-version: "3.13" }
          - { label: linux-glibc-arm64, runner: ubuntu-24.04-arm, python-version: "3.13" }
          - { label: macos-arm64, runner: macos-15, python-version: "3.13" }
          - { label: windows-x86_64, runner: windows-latest, python-version: "3.13" }
          - { label: linux-glibc-x86_64, runner: ubuntu-latest, python-version: "3.14" }
          # Free-threaded (no GIL) builds
          - { label: linux-glibc-x86_64, runner: ubuntu-latest, python-version: "3.14t" }
          - { label: linux-glibc-arm64, runner: ubuntu-24.04-arm, python-version: "3.14t" }
          - { label: macos-arm64, runner: macos-15, python-version: "3.14t" }
          - { label: windows-x86_64, runner: windows-latest, python-version: "3.14t" }

    env:
      # polars and deltalake have no free-threaded wheels: those runs leave out
      # the engines of the integration tests, which then skip.
      UV_NO_GROUP: ${{ endsWith(matrix.python-version, 't') && 'integrations' || '' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Environment
        uses: ./.github/actions/setup-env
        with:
          python-version: ${{ matrix.python-version }}
          # maturin gives pyo3 one signature for 3.14 and 3.14t, so cargo
          # would reuse a free-threaded pyo3 from the shared cache in a 3.14
          # build, whose module then fails to import.
          cache-shared-key: ${{ endsWith(matrix.python-version, 't') && 'ci-freethreaded' || 'ci' }}

      - name: Build and install unitycatalog
        run: just develop-client

      - name: Run tests
        run: just test

  # The tests marked `upstream`, against the upstream Java server
  # (upstream_image in the justfile), which runs in Docker.
  upstream:
    name: Python tests against upstream Unity Catalog
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    env:
      # Those tests use no engines.
      UV_NO_GROUP: integrations

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Build and install unitycatalog
        run: just develop-client

      - name: Run the tests against the upstream server
        run: just test-upstream

  # Spark against a uc-server: upstream's connector with delta-spark, and
  # Iceberg's Spark runtime (python/client/tests/integrations/test_spark.py).
  # Spark 4.1 has Iceberg's runtime, Spark 4.2 the view catalog API.
  spark:
    name: Spark tests (Spark ${{ matrix.spark }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        spark: ["4.1.3", "4.2.0"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Install Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      # The jars that Spark downloads: about 1 GB, most of it the AWS SDK of
      # hadoop-aws. PRs restore main's cache but never save their own copies.
      - name: Restore the Spark jars
        id: jars
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ivy2.5.2
          key: spark-jars-${{ matrix.spark }}-${{ hashFiles('python/client/tests/integrations/test_spark.py') }}

      - name: Build and install unitycatalog
        run: just develop-client

      - name: Run the Spark tests
        env:
          SPARK_VERSION: ${{ matrix.spark }}
        run: just test-spark "${SPARK_VERSION}"

      - name: Save the Spark jars
        if: github.ref == 'refs/heads/main' && steps.jars.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ivy2.5.2
          key: ${{ steps.jars.outputs.cache-primary-key }}
