name: release-python

# Builds the wheels of the four Python packages (python/) for all supported
# platforms and publishes them to PyPI via Trusted Publishing on tag push
# (v*.*.*):
#
# - unitycatalog-rs (python/client/), the client: for each (os, libc,
#   arch), an abi3-py312 wheel, which covers Python 3.12+, and a cp314t
#   wheel for free-threaded 3.14, which abi3 does not cover.
# - unitycatalog-rs-cli and unitycatalog-rs-server (python/cli/,
#   python/server/): the `uc` and `uc-server` binaries, a py3-none wheel
#   for each (os, libc, arch).
# - unitycatalog-rs-ui (python/ui/): the web UI, one py3-none-any wheel.
#
# Platforms: linux-gnu/{x86_64, aarch64} (manylinux_2_28),
# linux-musl/{x86_64, aarch64} (musllinux_1_2), macos/{x86_64, arm64},
# windows/x86_64.
#
# One-time setup required outside this workflow:
# - On PyPI, add this workflow (release-python.yml) as a trusted publisher
#   of each of the four projects: a pending publisher, for a new project.
# - Artifact attestations need a public repository: the attest steps skip
#   while the repository is private.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

# One run per tag at a time, never cancelled mid-publish.
concurrency:
  group: release-python-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  build-linux:
    name: Build wheel (linux ${{ matrix.libc }} ${{ matrix.arch }})
    # aarch64 builds run on native arm runners, without a cross toolchain.
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read       # checkout sources
      id-token: write      # OIDC for Sigstore signing via attest-build-provenance
      attestations: write  # publish SLSA provenance to repo attestation log

    strategy:
      fail-fast: true
      matrix:
        include:
          # glibc 2.28: Debian 10+, Ubuntu 18.10+, RHEL 8+.
          - target: x86_64-unknown-linux-gnu
            arch: x86_64
            libc: gnu
            manylinux: "2_28"
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            arch: aarch64
            libc: gnu
            manylinux: "2_28"
            runner: ubuntu-24.04-arm
          # musl: Alpine and other musl-based images.
          - target: x86_64-unknown-linux-musl
            arch: x86_64
            libc: musl
            manylinux: musllinux_1_2
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            arch: aarch64
            libc: musl
            manylinux: musllinux_1_2
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve release version from tag
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set release version
        uses: ./.github/actions/set-release-version
        with:
          version: ${{ steps.version.outputs.version }}

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          working-directory: python/client
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist -i python3.13 python3.14t
          sccache: false

      - name: Attest wheel provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: "python/client/dist/*.whl"

      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-linux-${{ matrix.libc }}-${{ matrix.arch }}
          path: python/client/dist/*.whl
          if-no-files-found: error

  build-macos:
    name: Build wheel (macos ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read       # checkout sources
      id-token: write      # OIDC for Sigstore signing via attest-build-provenance
      attestations: write  # publish SLSA provenance to repo attestation log

    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-apple-darwin
            arch: x86_64
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            arch: arm64
            runner: macos-14

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve release version from tag
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set release version
        uses: ./.github/actions/set-release-version
        with:
          version: ${{ steps.version.outputs.version }}

      - name: Install Python 3.13 and free-threaded 3.14t
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: |
            3.13
            3.14t

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          working-directory: python/client
          target: ${{ matrix.target }}
          args: --release --out dist -i python3.13 python3.14t
          sccache: false

      - name: Attest wheel provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: "python/client/dist/*.whl"

      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-macos-${{ matrix.arch }}
          path: python/client/dist/*.whl
          if-no-files-found: error

  build-windows:
    name: Build wheel (windows ${{ matrix.arch }})
    runs-on: windows-latest
    permissions:
      contents: read       # checkout sources
      id-token: write      # OIDC for Sigstore signing via attest-build-provenance
      attestations: write  # publish SLSA provenance to repo attestation log

    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x86_64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve release version from tag
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        # windows-latest defaults to pwsh; the bash parameter expansion
        # for ${REF_NAME#v} needs an explicit shell pin.
        shell: bash
        run: echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set release version
        uses: ./.github/actions/set-release-version
        with:
          version: ${{ steps.version.outputs.version }}

      - name: Install Python 3.13 and free-threaded 3.14t
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: |
            3.13
            3.14t

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          working-directory: python/client
          target: ${{ matrix.target }}
          args: --release --out dist -i python3.13 python3.14t
          sccache: false

      - name: Attest wheel provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: "python/client/dist/*.whl"

      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-windows-${{ matrix.arch }}
          path: python/client/dist/*.whl
          if-no-files-found: error

  # The binaries, as wheels of their own (maturin `bindings = "bin"`): no
  # Python ABI, so one wheel per platform.
  build-bins:
    name: Build ${{ matrix.package }} wheel (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read       # checkout sources
      id-token: write      # OIDC for Sigstore signing via attest-build-provenance
      attestations: write  # publish SLSA provenance to repo attestation log

    strategy:
      fail-fast: true
      matrix:
        package: [cli, server]
        platform:
          - linux-gnu-x86_64
          - linux-gnu-aarch64
          - linux-musl-x86_64
          - linux-musl-aarch64
          - macos-x86_64
          - macos-arm64
          - windows-x86_64
        # The client's runners and targets; aarch64 natively.
        include:
          - { platform: linux-gnu-x86_64, runner: ubuntu-latest, target: x86_64-unknown-linux-gnu, manylinux: "2_28" }
          - { platform: linux-gnu-aarch64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, manylinux: "2_28" }
          - { platform: linux-musl-x86_64, runner: ubuntu-latest, target: x86_64-unknown-linux-musl, manylinux: musllinux_1_2 }
          - { platform: linux-musl-aarch64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, manylinux: musllinux_1_2 }
          - { platform: macos-x86_64, runner: macos-15-intel, target: x86_64-apple-darwin }
          - { platform: macos-arm64, runner: macos-14, target: aarch64-apple-darwin }
          - { platform: windows-x86_64, runner: windows-latest, target: x86_64-pc-windows-msvc }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve release version from tag
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        # Also on Windows, whose default shell is pwsh.
        shell: bash
        run: echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set release version
        uses: ./.github/actions/set-release-version
        with:
          version: ${{ steps.version.outputs.version }}

      # `manylinux` is empty, and unused, off Linux.
      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          working-directory: python/${{ matrix.package }}
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
          sccache: false

      - name: Attest wheel provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: "python/${{ matrix.package }}/dist/*.whl"

      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-${{ matrix.package }}-${{ matrix.platform }}
          path: python/${{ matrix.package }}/dist/*.whl
          if-no-files-found: error

  # The web UI is the same on every platform: one py3-none-any wheel.
  build-ui:
    name: Build wheel (web UI)
    runs-on: ubuntu-latest
    permissions:
      contents: read       # checkout sources
      id-token: write      # OIDC for Sigstore signing via attest-build-provenance
      attestations: write  # publish SLSA provenance to repo attestation log

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve release version from tag
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set release version
        uses: ./.github/actions/set-release-version
        with:
          version: ${{ steps.version.outputs.version }}

      - name: Setup Environment (no cache — release builds run from fresh state)
        uses: ./.github/actions/setup-env
        with:
          cache: "false"

      # `just wasm` compresses the wasm with the brotli tool.
      - name: Install brotli
        run: command -v brotli || (sudo apt-get update && sudo apt-get install -y brotli)

      - name: Build the web UI
        run: just wasm

      - name: Build wheel
        run: uv build --wheel --package unitycatalog-rs-ui --out-dir python/ui/dist

      - name: Attest wheel provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: "python/ui/dist/*.whl"

      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-ui
          path: python/ui/dist/*.whl
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: [build-linux, build-macos, build-windows, build-bins, build-ui]
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # PyPI Trusted Publishing exchanges OIDC for upload token

    steps:
      - name: Download all wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: "wheel-*"
          merge-multiple: true

      - name: List dist
        run: ls -la dist

      # Trusted publishing is handled by PyO3/maturin-action itself:
      # given `id-token: write` it exchanges the OIDC token for a PyPI
      # publish token and sets MATURIN_PYPI_TOKEN.
      - name: Publish to PyPI
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: upload
          args: --non-interactive --skip-existing dist/*
