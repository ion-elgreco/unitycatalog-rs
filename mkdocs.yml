# The docs site: zensical builds docs/ with these settings (`just
# docs-build`, `just docs-serve`); mike publishes a copy per release on the
# gh-pages branch (`just docs-deploy`, release-docs.yml).
site_name: unitycatalog-rs
site_description: A Rust reimplementation of Unity Catalog OSS, the open catalog for data and AI
site_url: https://ion-elgreco.github.io/unitycatalog-rs/
repo_url: https://github.com/ion-elgreco/unitycatalog-rs
repo_name: unitycatalog-rs

extra:
  version:
    provider: mike

extra_css:
  - stylesheets/extra.css

theme:
  name: material
  # The web UI's logo, without its text, and its favicon.
  logo: assets/logo.svg
  favicon: assets/favicon.ico
  icon:
    repo: fontawesome/brands/github
  # Dark first. With no `media` key Material takes the first palette as the
  # default, and each palette carries the toggle that leaves it.
  palette:
    - scheme: slate
      primary: blue
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: blue
      accent: light blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - content.code.copy
    - content.code.annotate
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - search.highlight
    - search.share
    - toc.follow
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top

nav:
  - Home: index.md
  - Kubernetes: kubernetes.md
  - Docker: docker.md
  - Server:
      - server/index.md
      - Settings: server/settings.md
      - Database: server/database.md
      - Sign-in and authorization: server/auth.md
      - Cloud storage: server/cloud-storage.md
      - APIs: server/apis.md
      - Operations: server/operations.md
  - CLI:
      - cli/index.md
      - Commands: cli/commands.md
  - Python client: python-client.md
  - Web UI: ui.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets
  - attr_list
  - md_in_html
  - toc:
      permalink: true
