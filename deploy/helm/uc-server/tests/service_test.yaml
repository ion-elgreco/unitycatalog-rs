suite: server Service
templates:
  - templates/server/service.yaml
release:
  name: uc-server
  namespace: unitycatalog
tests:
  - it: exposes the API and the probes of the server pods
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: uc-server-server
      - equal:
          path: spec.type
          value: ClusterIP
      - equal:
          path: spec.ports
          value:
            - name: api
              port: 8080
              targetPort: api
              protocol: TCP
            - name: obs
              port: 8081
              targetPort: obs
              protocol: TCP
      - equal:
          path: spec.selector
          value:
            app.kubernetes.io/name: uc-server
            app.kubernetes.io/instance: uc-server
            app.kubernetes.io/component: server

  - it: takes the type and the port from the values
    set:
      server.service.type: LoadBalancer
      server.service.port: 80
    asserts:
      - equal:
          path: spec.type
          value: LoadBalancer
      - equal:
          path: spec.ports[0].port
          value: 80
