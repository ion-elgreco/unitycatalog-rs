suite: ServiceAccount
templates:
  - templates/serviceaccount.yaml
release:
  name: uc-server
  namespace: unitycatalog
tests:
  - it: omits the ServiceAccount by default
    asserts:
      - hasDocuments:
          count: 0

  - it: makes one named after the release
    set:
      serviceAccount.create: true
      serviceAccount.annotations:
        eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/uc
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: uc-server
      - equal:
          path: metadata.annotations["eks.amazonaws.com/role-arn"]
          value: arn:aws:iam::123456789012:role/uc
      - equal:
          path: automountServiceAccountToken
          value: true

  - it: takes the name and the token mount from the values
    set:
      serviceAccount.create: true
      serviceAccount.name: catalog
      serviceAccount.automount: false
    asserts:
      - equal:
          path: metadata.name
          value: catalog
      - equal:
          path: automountServiceAccountToken
          value: false
