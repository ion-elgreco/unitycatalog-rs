suite: HTTPRoute
templates:
  - templates/httpRoute.yaml
release:
  name: uc-server
  namespace: unitycatalog
tests:
  - it: omits the HTTPRoute by default
    asserts:
      - hasDocuments:
          count: 0

  - it: routes every path of the host to the server
    set:
      httpRoute.enabled: true
      httpRoute.host: uc.example.com
      httpRoute.parentRefs:
        - name: gateway
          namespace: gateways
    asserts:
      - isKind:
          of: HTTPRoute
      - equal:
          path: metadata.name
          value: uc-server
      - equal:
          path: spec.parentRefs
          value:
            - name: gateway
              namespace: gateways
      - equal:
          path: spec.hostnames
          value: [uc.example.com]
      - equal:
          path: spec.rules[0].matches[0].path
          value:
            type: PathPrefix
            value: /
      - equal:
          path: spec.rules[0].backendRefs
          value:
            - name: uc-server-server
              port: 8080

  - it: fails install without parentRefs
    set:
      httpRoute.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: "httpRoute.parentRefs is required"
