suite: signing key Secret
templates:
  - templates/server/keypair-secret.yaml
release:
  name: uc-server
  namespace: unitycatalog
tests:
  - it: makes an RSA key at install, and keeps it
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: uc-server-server-jwt-key
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-install
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
      - matchRegex:
          path: data["private_key.pem"]
          decodeBase64: true
          pattern: ^-----BEGIN RSA PRIVATE KEY-----
      - notExists:
          path: data["key_id.txt"]

  - it: takes the name of an existing Secret
    set:
      server.jwtKeypairSecret.name: my-key
    asserts:
      - equal:
          path: metadata.name
          value: my-key

  - it: makes no Secret when told not to
    set:
      server.jwtKeypairSecret.create: false
    asserts:
      - hasDocuments:
          count: 0
