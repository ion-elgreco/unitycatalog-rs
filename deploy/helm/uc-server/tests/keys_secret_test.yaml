suite: keys Secret
templates:
  - templates/server/keys-secret.yaml
release:
  name: uc-server
  namespace: unitycatalog
tests:
  - it: makes the keys at install, and keeps them
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: uc-server-server-keys
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-install
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
      - matchRegex:
          path: data["private_key.pem"]
          decodeBase64: true
          pattern: ^-----BEGIN RSA PRIVATE KEY-----
      - matchRegex:
          path: data["secrets_key.pem"]
          decodeBase64: true
          pattern: ^-----BEGIN EC PRIVATE KEY-----
      - notExists:
          path: data["key_id.txt"]

  - it: takes the name of an existing Secret
    set:
      server.keysSecret.name: my-key
    asserts:
      - equal:
          path: metadata.name
          value: my-key

  - it: makes no Secret when told not to
    set:
      server.keysSecret.create: false
    asserts:
      - hasDocuments:
          count: 0
