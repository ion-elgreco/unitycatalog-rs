# Values follow upstream's chart (helm/ in unitycatalog/unitycatalog) where
# they mean the same. The database is an embedded Turso file (instead of
# H2's) or a PostgreSQL server that several replicas share, as upstream.

storage:
  # -- Where models go when their catalog and schema have no storage root
  # (upstream `storage-root.models`).
  modelStorageRoot: ""
  # -- Where MANAGED tables go when their catalog and schema have no storage
  # root (upstream `storage-root.tables`).
  tableStorageRoot: ""

  # The server's own identity in each cloud (`[identity.<cloud>]`), which
  # signs in for storage credentials. Empty: the pod's identity from its
  # environment, such as EKS IRSA or Pod Identity, AKS workload identity (see
  # `serviceAccount.annotations` and `server.deployment.extraPodLabels`) or
  # GKE Workload Identity.
  identity:
    aws:
      # -- A secret with the `accessKey` and `secretKey` of an AWS identity.
      credentialsSecretName: ""
      # -- The region of STS calls.
      region: ""
      # -- The ARN of the server's AWS identity, shown on storage credentials
      # as `unity_catalog_iam_arn` for the trust policies of their roles.
      arn: ""
      # -- The S3 and STS API of an S3-compatible store, such as MinIO.
      endpoint: ""
    azure:
      # -- A service principal: a secret with `directoryId`, `applicationId`
      # and `clientSecret`.
      credentialsSecretName: ""
      # -- Or the resource ID of a user-assigned managed identity.
      managedIdentityId: ""
    gcp:
      # -- A service account key: a secret with `jsonKey`.
      credentialsSecretName: ""

  # -- Locations and the identities that reach them (`[locations.<name>]`),
  # for paths without an external location. The URL's scheme picks the
  # cloud, and an entry holds one identity of it. `credentialsSecretName` is
  # a service principal for abfss:// (`directoryId`, `applicationId`,
  # `clientSecret`) and a service account key for gs:// (`jsonKey`).
  # `awsIamRoleArn`, `azureManagedIdentity` and `gcpServiceAccount` take
  # `true` for the server's own identity, or a role ARN, a resource ID or an
  # email.
  # - url: s3://my-bucket
  #   region: us-east-1
  #   awsIamRoleArn: arn:aws:iam::123456789012:role/my-role
  # - url: abfss://data@myaccount.dfs.core.windows.net
  #   credentialsSecretName: my-service-principal
  # - url: abfss://data@otheraccount.dfs.core.windows.net
  #   azureManagedIdentity: true
  # - url: gs://my-bucket
  #   gcpServiceAccount: unity-catalog@my-project.iam.gserviceaccount.com
  # - url: gs://other-bucket
  #   credentialsSecretName: my-service-account-key
  locations: []

auth:
  # -- Sign-in and authorization (upstream `server.authorization`).
  enabled: false
  # -- Users that the server makes at each start when they are missing
  # (`[[auth.users]]` in its uc.toml). It never changes or deletes a user
  # that exists, and grants the missing `privileges` on the metastore again.
  # - email: alice@example.com
  #   name: Alice
  #   privileges: ["CREATE CATALOG"]
  # - email: etl@example.com
  #   externalId: <the id of the ETL job's OAuth client>
  users: []
  # -- The identity providers whose tokens the server takes
  # (`[[auth.issuers]]` in its uc.toml): at the token exchange of
  # `uc auth login`, and with `direct` on every request, as a service
  # principal or a service account signs in.
  # - name: entra
  #   issuer: https://login.microsoftonline.com/<tenant>/v2.0
  #   audiences: ["api://uc"]
  #   direct: true
  #   principalClaims: [preferred_username, oid]
  #   clientClaims: [azp, appid]
  #   groupsClaim: roles
  #   createUsers: true
  #   displayName: "{app_displayname}"
  # - name: google
  #   issuer: https://accounts.google.com
  #   audiences: [<client id>]
  issuers: []
  # -- Sign-in to the web UI: the server signs users in with an OpenID
  # Connect provider (`UC_AUTH_MODE=oidc`); a user signs in when `users` (or
  # SCIM) has their email.
  oidc:
    # -- The provider's issuer, such as `https://accounts.google.com`; its
    # discovery document has the endpoints. Empty: no sign-in to the UI.
    issuer: ""
    # -- A Secret with the OAuth client's `clientId` and `clientSecret`
    # (upstream's `clientSecretName`; no `clientSecret` for a public client).
    clientSecretName: ""
    # -- The scopes the server asks for.
    scopes: openid email profile
    # -- "Log out" also ends the provider's session, so that the next
    # sign-in asks for the password again; the provider must allow the
    # post-logout redirect URI `<publicUrl>/`. Off, a provider that other
    # apps share keeps their sign-in.
    endSession: false
  # -- The server's external URL, such as `https://uc.example.com`: the
  # provider returns the browser to `<publicUrl>/auth/callback`, and with
  # `oidc.endSession` to `<publicUrl>/` after "Log out".
  publicUrl: ""
  # -- Sign-in through an auth proxy in front of the server, such as
  # oauth2-proxy or Authelia (`UC_AUTH_MODE=forward`): the proxy signs users
  # in and names the user in its headers. Not with `oidc`.
  forward:
    # -- The proxies' addresses, as comma-separated CIDRs or addresses, such
    # as `10.42.0.0/16`: only their headers count. Empty: no forward sign-in.
    trustedProxies: ""
    # -- The header with the user's email.
    emailHeader: Remote-Email
    # -- The header with the user, without the email header.
    userHeader: Remote-User
    # -- The proxy's sign-out, where the UI's "Log out" goes.
    logoutUrl: ""
  cookieTimeout: 5d
  accessTokenTimeout: 24h

server:
  enabled: true

  db:
    # -- `file`: the embedded Turso database on a volume (one replica).
    # `postgresql`: a PostgreSQL server that every replica shares.
    type: file
    fileConfig:
      persistence:
        # -- Without persistence the catalog is lost with the pod.
        enabled: true
        pvcName: ""
        createPVC: true
        accessModes: ["ReadWriteOnce"]
        size: 1Gi
        storageClassName: ""
    postgresqlConfig:
      # -- PostgreSQL host (required).
      host: ""
      port: 5432
      dbName: ucdb
      username: postgres
      # -- Secret with the user's password; none without it.
      passwordSecretName: ""
      passwordSecretKey: password
      ssl:
        # -- Without it, TLS when the server offers it, unchecked
        # (libpq's `prefer`).
        enabled: false
        # -- libpq's `sslmode`: `require`, `verify-ca` or `verify-full`.
        mode: verify-full
        # -- PEM of the root certificate; the system's roots without one.
        rootCert: ""
        # -- Or a ConfigMap with it.
        rootCertConfigMapName: ""
        rootCertConfigMapKey: ca.crt
      # -- More URL parameters, such as `application_name`.
      extraParams: {}

  config:
    # -- A uc.toml for settings that these values do not have, such as
    # `[tables]`; the chart's variables win over it. Each setting is also a
    # variable for `deployment.env`: `UC_TABLES_MANAGED` is `managed` in
    # `[tables]`.
    toml: ""

  service:
    type: ClusterIP
    port: 8080

  deployment:
    replicaCount: 1
    port: 8080
    # -- Probes and metrics (`--obs-port`).
    obsPort: 8081
    image:
      repository: ghcr.io/ion-elgreco/unitycatalog-rs
      pullPolicy: IfNotPresent
      # -- Defaults to the chart's appVersion.
      tag: ""
    imagePullSecrets: []
    extraInitContainers: []
    extraContainers: []
    extraPodAnnotations: {}
    extraPodLabels: {}
    # -- The image's user (distroless `nonroot`); `fsGroup` lets it write
    # on the database volume.
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 65532
      runAsGroup: 65532
      fsGroup: 65532
      seccompProfile:
        type: RuntimeDefault
    # -- The server writes only on its volumes: the database and `/tmp`
    # (an emptyDir); it logs to stdout.
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]
    resources: {}
    # -- More environment variables: `UC_<GROUP>_<KEY>` settings.
    env: {}
    extraVolumes: []
    extraVolumeMounts: []
    nodeSelector: {}
    tolerations: []
    affinity: {}
    updateStrategy: {}
    enableLivenessProbe: true
    livenessProbe: {}
    enableReadinessProbe: true
    readinessProbe: {}
    enableStartupProbe: true
    startupProbe: {}

  keysSecret:
    # -- An existing secret with the server's keys: `private_key.pem`, the
    # RSA key that signs its tokens, and `secrets_key.pem`, the P-256 key
    # that seals the secrets of storage credentials. By default the chart
    # makes one at install.
    name: ""
    create: true

  # -- RUST_LOG
  logLevel: info

ui:
  # -- The server serves the web UI at `/` for browsers; its sign-in is
  # `auth.oidc`.
  enabled: true

nameOverride: ""
fullnameOverride: ""

ingress:
  enabled: false
  host: ""
  ingressClassName: ""
  annotations: {}
  tlsSecretName: ""

httpRoute:
  enabled: false
  host: ""
  parentRefs: []
  annotations: {}

serviceAccount:
  create: false
  automount: true
  annotations: {}
  name: ""
