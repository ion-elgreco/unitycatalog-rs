{{- if .Values.httpRoute.enabled -}}
{{- /* `required` lets the default empty list through. */}}
{{- if not .Values.httpRoute.parentRefs }}
{{- fail "httpRoute.parentRefs is required" }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "unitycatalog.fullname" . | quote }}
  labels: {{- include "unitycatalog.labels" . | nindent 4 }}
  {{- with .Values.httpRoute.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs: {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  {{- with .Values.httpRoute.host }}
  hostnames: [{{ . | quote }}]
  {{- end }}
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - name: {{ include "unitycatalog.server.fullname" . | quote }}
          port: {{ .Values.server.service.port }}
{{- end }}
