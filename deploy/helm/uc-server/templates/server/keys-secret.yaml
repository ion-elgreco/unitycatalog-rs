{{- if and .Values.server.enabled .Values.server.keysSecret.create -}}
{{- $secretName := include "unitycatalog.server.keysSecretName" . -}}
{{- $secret := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- if not $secret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName | quote }}
  labels: {{- include "unitycatalog.server.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- /* The RSA key that signs the server's tokens. */}}
  private_key.pem: {{ genPrivateKey "rsa" | b64enc | quote }}
  {{- /* The P-256 key that seals the secrets of storage credentials. */}}
  secrets_key.pem: {{ genPrivateKey "ecdsa" | b64enc | quote }}
{{- else -}}
  {{- range list "private_key.pem" "secrets_key.pem" }}
    {{- if not (hasKey $secret.data .) }}
      {{- fail (printf "Secret '%s' needs %s" $secretName .) }}
    {{- end }}
  {{- end }}
{{- end -}}
{{- end -}}
