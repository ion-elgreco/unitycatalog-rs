{{- if and .Values.server.enabled .Values.server.jwtKeypairSecret.create -}}
{{- $secretName := include "unitycatalog.server.jwtKeypairSecretName" . -}}
{{- $secret := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- if not $secret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName | quote }}
  labels: {{- include "unitycatalog.server.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- /* The RSA key that signs the server's tokens. */}}
  private_key.pem: {{ genPrivateKey "rsa" | b64enc | quote }}
{{- else -}}
  {{- if not (hasKey $secret.data "private_key.pem") }}
    {{- fail (printf "Secret '%s' needs private_key.pem" $secretName) }}
  {{- end }}
{{- end -}}
{{- end -}}
