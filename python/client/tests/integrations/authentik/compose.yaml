# authentik for `just test-authentik`: its server, its worker and its
# PostgreSQL, as authentik's own compose file has them. The API is on
# 127.0.0.1:${AUTHENTIK_PORT}, default 19000; the bootstrap token below signs
# in as akadmin. The worker sends the SCIM requests, to uc-server on the host
# (host.docker.internal). The database is in memory: each start is a new
# authentik.

name: uc-test-authentik

x-authentik: &authentik
  image: ghcr.io/goauthentik/server:2026.8.5
  environment:
    AUTHENTIK_POSTGRESQL__HOST: postgresql
    AUTHENTIK_POSTGRESQL__NAME: authentik
    AUTHENTIK_POSTGRESQL__USER: authentik
    AUTHENTIK_POSTGRESQL__PASSWORD: authentik
    AUTHENTIK_SECRET_KEY: uc-test-authentik-secret-key-not-for-production
    AUTHENTIK_BOOTSTRAP_EMAIL: akadmin@example.com
    AUTHENTIK_BOOTSTRAP_PASSWORD: akadmin
    AUTHENTIK_BOOTSTRAP_TOKEN: ${AUTHENTIK_TOKEN:-uc-test-authentik-token}
    AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
    AUTHENTIK_DISABLE_UPDATE_CHECK: "true"
    AUTHENTIK_DISABLE_STARTUP_ANALYTICS: "true"
  # Linux has no host.docker.internal of its own.
  extra_hosts:
    - host.docker.internal:host-gateway
  # The image checks every 30 seconds.
  healthcheck:
    test: ["CMD", "ak", "healthcheck"]
    interval: 2s
    timeout: 10s
    start_period: 300s
    retries: 3
  depends_on:
    postgresql:
      condition: service_healthy

services:
  postgresql:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: authentik
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: authentik
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authentik -d authentik"]
      interval: 1s
      retries: 60

  server:
    <<: *authentik
    command: server
    ports:
      - "127.0.0.1:${AUTHENTIK_PORT:-19000}:9000"

  worker:
    <<: *authentik
    command: worker
