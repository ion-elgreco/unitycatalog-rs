[package]
name = "uc-py"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Python bindings for the unitycatalog-rs Rust client (uc-client)."
readme = "README.md"

[lib]
name = "_core"
# `rlib` for the stub generator, `src/bin/stub_gen.rs`.
crate-type = ["cdylib", "rlib"]
# No Rust tests: a test binary of an extension module cannot link, as it
# does not link Python. The Python tests in tests/ cover the crate.
test = false
doctest = false

[[bin]]
name = "stub_gen"
doc = false
required-features = ["stub-gen"]

[features]
# An extension module leaves Python's symbols to the Python that loads it,
# so cargo builds it without a Python interpreter.
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]
# The stub generator. It runs Python, so `just generate-stubs` builds it
# without `extension-module`.
stub-gen = []

[dependencies]
uc-common.workspace = true
uc-api.workspace = true
uc-client.workspace = true

pyo3.workspace = true
pyo3-async-runtimes.workspace = true
pyo3-stub-gen.workspace = true

serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread"] }

[build-dependencies]
pyo3-build-config.workspace = true
