[package]
name = "uc-py"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Python bindings of the unitycatalog-rs Rust client (uc-client)."
readme = "README.md"

[lib]
name = "_core"
crate-type = ["cdylib"]
# No Rust tests: a test binary of an extension module cannot link, as it
# does not link Python. The Python tests in tests/ cover the crate.
test = false
doctest = false

[features]
# An extension module leaves Python's symbols to the Python that loads it,
# so cargo builds it without a Python interpreter.
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]

[dependencies]
# `python`: the PyO3 classes of the models, which the bindings in src/codegen return.
uc-client = { workspace = true, features = ["python"] }

pyo3.workspace = true
pyo3-async-runtimes.workspace = true

futures.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread"] }
url.workspace = true

[build-dependencies]
pyo3-build-config.workspace = true
