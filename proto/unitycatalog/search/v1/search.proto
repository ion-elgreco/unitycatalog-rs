syntax = "proto3";

package unitycatalog.search.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";

// A catalog, schema, table, volume, function or registered model whose name or comment holds the
// words of a search.
message SearchResult {
  // Type of the object: `catalog`, `schema`, `table`, `volume`, `function` or `registered_model`.
  string securable_type = 1;
  // Full name of the object: `<catalog>`, `<catalog>.<schema>` or `<catalog>.<schema>.<name>`.
  string full_name = 2;
  // Name of the catalog of the object, or of the catalog itself.
  string catalog_name = 3;
  // Name of the schema of the object, or of the schema itself. Absent for a catalog.
  optional string schema_name = 4;
  // Name of the object, relative to its parent.
  string name = 5;
  // User-provided free-form text description.
  optional string comment = 6;
  // Username of the owner of the object.
  optional string owner = 7;
  // Time at which the object was created, in epoch milliseconds.
  int64 created_at = 8;
  // Time at which the object was last changed, in epoch milliseconds.
  int64 updated_at = 9;
  // Unique identifier of the object.
  string id = 10;
}

message SearchObjectsRequest {
  // The words to find in the names and comments. An object matches when it holds all of them.
  string query = 1 [(google.api.field_behavior) = REQUIRED];
  // Return only the objects of this type: `catalog`, `schema`, `table`, `volume`, `function` or
  // `registered_model`.
  optional string securable_type = 2;
  // The maximum number of results to return.
  optional int32 max_results = 3;
  // Opaque token of the page to return: the `next_page_token` of the page before.
  optional string page_token = 4;
}

message SearchObjectsResponse {
  // The results: first the names equal to the query, then the names that start with it, the
  // names that hold it, and the objects whose comment holds its words. Only the objects that the
  // caller may read.
  repeated SearchResult results = 1;
  // Opaque token of the next page. Absent on the last page.
  optional string next_page_token = 2;
}

// Search: the catalogs, schemas, tables, volumes, functions and registered models whose name or
// comment holds some words.
service SearchService {
  // Find the objects whose name or comment holds all the words of a query.
  rpc SearchObjects(SearchObjectsRequest) returns (SearchObjectsResponse) {
    option (google.api.http) = {get: "/api/2.1/unity-catalog/search"};
  }
}
