syntax = "proto3";

package unitycatalog.recipients.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/empty.proto";

enum AuthenticationType {
  // No authentication is required.
  AUTHENTICATION_TYPE_UNSPECIFIED = 0;

  // Basic authentication is required.
  TOKEN = 1;

  // OAuth2 authentication is required.
  OAUTH_CLIENT_CREDENTIALS = 2;
}

// An object with the properties of a securable as key-value pairs.
message SecurablePropertiesKvPairs {
  // A map of key-value properties attached to the securable.
  map<string, string> properties = 1 [(google.api.field_behavior) = REQUIRED];
}

message RecipientToken {
  // Unique ID of the recipient token.
  string id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Time at which this recipient token was created, in epoch milliseconds.
  int64 created_at = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Username of recipient token creator.
  string created_by = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Full activation URL to retrieve the access token. It will be empty if the token is already retrieved.
  string activation_url = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Expiration timestamp of the token in epoch milliseconds.
  int64 expiration_time = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Time at which this recipient token was updated, in epoch milliseconds.
  int64 updated_at = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Username of recipient token updater.
  string updated_by = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message Recipient {
  option (google.api.resource) = {
    type: "unitycatalog.io/Recipient"
    pattern: "recipients/{recipient}"
    plural: "recipients"
    singular: "recipient"
  };

  // Unique ID of the recipient.
  optional string id = 100 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.field_behavior) = IDENTIFIER
  ];

  // The name of the recipient.
  string name = 1 [(google.api.field_behavior) = REQUIRED];

  // The delta sharing authentication type.
  AuthenticationType authentication_type = 2 [(google.api.field_behavior) = REQUIRED];

  // Username of the recipient owner.
  optional string owner = 3 [(google.api.field_behavior) = OPTIONAL];

  // Description about the recipient.
  optional string comment = 4 [(google.api.field_behavior) = OPTIONAL];

  // Recipient properties as map of string key-value pairs.
  optional SecurablePropertiesKvPairs properties_kvpairs = 6 [(google.api.field_behavior) = OPTIONAL];

  // Time at which this recipient was created, in epoch milliseconds.
  optional int64 created_at = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Username of recipient creator.
  optional string created_by = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  // This field is only present when the authentication_type is TOKEN.
  repeated RecipientToken tokens = 9 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Time at which this recipient was updated, in epoch milliseconds.
  optional int64 updated_at = 10 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Username of recipient updater.
  optional string updated_by = 11 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Request to list recipients.
message ListRecipientsRequest {
  // The maximum number of results per page that should be returned.
  //
  // If unset or 0, the server's default page size is used. Negative values are rejected.
  optional int32 max_results = 1 [(google.api.field_behavior) = OPTIONAL];

  // Opaque pagination token to go to next page based on previous query.
  optional string page_token = 2 [(google.api.field_behavior) = OPTIONAL];
}

// Response to list recipients.
message ListRecipientsResponse {
  // List of recipients.
  repeated Recipient recipients = 1;

  // Opaque pagination token to go to next page based on previous query.
  optional string next_page_token = 2;
}

// Creates a new recipient
message CreateRecipientRequest {
  // Name of the recipient.
  string name = 1 [(google.api.field_behavior) = REQUIRED];

  // The delta sharing authentication type. The server has `TOKEN` only, which is the default.
  optional AuthenticationType authentication_type = 2 [(google.api.field_behavior) = OPTIONAL];

  // Username of the recipient owner. The default is the caller.
  optional string owner = 3 [(google.api.field_behavior) = OPTIONAL];

  // Description about the recipient.
  optional string comment = 4 [(google.api.field_behavior) = OPTIONAL];

  // Recipient properties as map of string key-value pairs.
  //
  // When provided in update request, the specified properties will override the existing properties.
  // To add and remove properties, one would need to perform a read-modify-write.
  optional SecurablePropertiesKvPairs properties_kvpairs = 5 [(google.api.field_behavior) = OPTIONAL];

  // Expiration timestamp of the token, in epoch milliseconds.
  optional int64 expiration_time = 6 [(google.api.field_behavior) = OPTIONAL];
}

// Get a recipient by name.
message GetRecipientRequest {
  // Name of the recipient.
  string name = 1 [(google.api.field_behavior) = REQUIRED];
}

// Update a recipient
message UpdateRecipientRequest {
  // Name of the recipient.
  string name = 1 [(google.api.field_behavior) = REQUIRED];

  // New name for the recipient
  optional string new_name = 2 [(google.api.field_behavior) = OPTIONAL];

  // Username of the recipient owner.
  optional string owner = 3 [(google.api.field_behavior) = OPTIONAL];

  // Description about the recipient.
  optional string comment = 4 [(google.api.field_behavior) = OPTIONAL];

  // Recipient properties as map of string key-value pairs.
  //
  // When provided in update request, the specified properties will override the existing properties.
  // To add and remove properties, one would need to perform a read-modify-write.
  optional SecurablePropertiesKvPairs properties_kvpairs = 5 [(google.api.field_behavior) = OPTIONAL];

  // Expiration timestamp of the token, in epoch milliseconds.
  optional int64 expiration_time = 6 [(google.api.field_behavior) = OPTIONAL];
}

// Delete a recipient
message DeleteRecipientRequest {
  // Name of the recipient.
  string name = 1 [(google.api.field_behavior) = REQUIRED];
}

// Rotate a recipient's bearer token.
message RotateRecipientTokenRequest {
  // Name of the recipient.
  string name = 1 [(google.api.field_behavior) = REQUIRED];

  // Seconds until the existing token expires. It can only shorten the
  // existing token's lifetime, never extend it; 0 expires it immediately.
  optional int64 existing_token_expire_in_seconds = 2 [(google.api.field_behavior) = OPTIONAL];
}

// A Delta Sharing profile file (`profile.json`): what a Delta Sharing client needs to connect to
// the server as a recipient. The JSON names are lowerCamelCase, as the protocol has them.
message RecipientProfile {
  // Version of the profile file format. Always 1.
  int32 share_credentials_version = 1 [json_name = "shareCredentialsVersion"];
  // URL of the Delta Sharing server: the URL the caller used, ending in
  // `/api/v1/delta-sharing`.
  string endpoint = 2;
  // The bearer token of the recipient.
  string bearer_token = 3 [
    json_name = "bearerToken",
    debug_redact = true
  ];
  // Time at which the token expires, as an ISO 8601 timestamp. Not set for a token that does not
  // expire.
  optional string expiration_time = 4 [json_name = "expirationTime"];
}

message ActivateRecipientTokenRequest {
  // The code of the activation link.
  string code = 1 [(google.api.field_behavior) = REQUIRED];
}

// Recipients
//
// A recipient is an object you create using recipients/create to represent an organization which
// you want to allow access shares. when you create a recipient object, Unity Catalog generates an
// activation link you can send to the recipient. The recipient follows the activation link to download
// the credential file, and then uses the credential file to establish a secure connection to receive
// the shared data. This sharing mode is called open sharing.
service RecipientsService {
  // List recipients.
  rpc ListRecipients(ListRecipientsRequest) returns (ListRecipientsResponse) {
    option (google.api.http) = {get: "/api/2.1/unity-catalog/recipients"};
  }

  // Create a new recipient.
  rpc CreateRecipient(CreateRecipientRequest) returns (Recipient) {
    option (google.api.http) = {
      post: "/api/2.1/unity-catalog/recipients"
      body: "*"
    };
  }

  // Get a recipient by name.
  rpc GetRecipient(GetRecipientRequest) returns (Recipient) {
    option (google.api.http) = {get: "/api/2.1/unity-catalog/recipients/{name}"};
  }

  // Update a recipient.
  rpc UpdateRecipient(UpdateRecipientRequest) returns (Recipient) {
    option (google.api.http) = {
      patch: "/api/2.1/unity-catalog/recipients/{name}"
      body: "*"
    };
  }

  // Delete a recipient.
  rpc DeleteRecipient(DeleteRecipientRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/api/2.1/unity-catalog/recipients/{name}"};
  }

  // Rotate a recipient's token: issue a new token (and activation link) and
  // retire the existing one.
  rpc RotateRecipientToken(RotateRecipientTokenRequest) returns (Recipient) {
    option (google.api.http) = {
      post: "/api/2.1/unity-catalog/recipients/{name}/rotate-token"
      body: "*"
    };
  }
}

// The activation links of recipient tokens.
service ActivationsService {
  // Open the activation link of a token: the Delta Sharing profile with the bearer token. A link
  // works once, and the request needs no sign-in: the code is the secret. The server keeps a hash
  // of the token only after this.
  rpc ActivateRecipientToken(ActivateRecipientTokenRequest) returns (RecipientProfile) {
    option (google.api.http) = {get: "/api/1.0/opensharing/activations/{code}"};
  }
}
