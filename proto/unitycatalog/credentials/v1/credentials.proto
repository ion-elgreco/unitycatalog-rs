syntax = "proto3";

package unitycatalog.credentials.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/empty.proto";

// What a credential is used for.
enum CredentialPurpose {
  CREDENTIAL_PURPOSE_UNSPECIFIED = 0;
  // The credential gives access to external services.
  SERVICE_PRINCIPAL = 1;
  // The credential gives access to storage.
  STORAGE = 2;
}

// The AWS IAM role of a new or changed credential.
message AwsIamRoleRequest {
  // ARN of the AWS IAM role that the server assumes to make temporary credentials.
  string role_arn = 1 [(google.api.field_behavior) = REQUIRED];
}

// The AWS IAM role of a credential.
message AwsIamRoleResponse {
  // ARN of the AWS IAM role that the server assumes to make temporary credentials.
  string role_arn = 1;
  // ARN of the server's own AWS role, which assumes `role_arn`. Absent when the server has no
  // role of its own.
  optional string unity_catalog_iam_arn = 2;
  // External ID that the server sends when it assumes the role. The trust policy of the role
  // should require it. Each new role gets a new external ID.
  string external_id = 3;
}

// The Azure service principal of a new or changed credential.
message AzureServicePrincipalRequest {
  // ID of the Microsoft Entra ID tenant (directory) of the application.
  string directory_id = 1 [(google.api.field_behavior) = REQUIRED];
  // Application (client) ID of the service principal.
  string application_id = 2 [(google.api.field_behavior) = REQUIRED];
  // Client secret of the application. The server stores it and never returns it.
  string client_secret = 3 [
    (google.api.field_behavior) = REQUIRED,
    debug_redact = true
  ];
}

// The Azure service principal of a credential. The client secret is not returned.
message AzureServicePrincipalResponse {
  // ID of the Microsoft Entra ID tenant (directory) of the application.
  string directory_id = 1;
  // Application (client) ID of the service principal.
  string application_id = 2;
}

// The Azure managed identity of a credential: the server's own Azure identity.
message AzureManagedIdentity {
  // Azure resource ID of a user-assigned managed identity, which the server gets from the
  // instance metadata service. Absent: the identity that the server's environment gives, such as
  // AKS workload identity or the managed identity of the VM.
  optional string managed_identity_id = 1;
}

// The GCP service account of a credential: the server's own identity, or a service account that
// the server impersonates.
message GcpServiceAccount {
  // Email of the service account that the server impersonates. The server's identity needs the
  // role Service Account Token Creator on it. Absent: the server's own identity, from Application
  // Default Credentials or the metadata server.
  optional string email = 1;
}

// The GCP service account key of a new or changed credential.
message GcpServiceAccountKeyRequest {
  // The JSON key file of the service account. The server stores it and never returns it.
  string json_key = 1 [
    (google.api.field_behavior) = REQUIRED,
    debug_redact = true
  ];
}

// The GCP service account key of a credential. The key is not returned.
message GcpServiceAccountKeyResponse {
  // Email of the service account.
  string email = 1;
  // ID of the key.
  string private_key_id = 2;
}

// A credential that gives access to storage or to external services.
message CredentialInfo {
  option (google.api.resource) = {
    type: "unitycatalog.io/Credential"
    pattern: "credentials/{credential}"
    plural: "credentials"
    singular: "credential"
  };

  // Name of the credential.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  // The AWS IAM role of the credential.
  AwsIamRoleResponse aws_iam_role = 2;
  // User-provided free-form text description.
  optional string comment = 3;
  // Username of the owner of the credential.
  optional string owner = 4;
  // Full name of the credential: the same as `name`.
  string full_name = 5;
  // Unique identifier of the credential.
  string id = 6;
  // Time at which the credential was created, in epoch milliseconds.
  int64 created_at = 7;
  // Username of the creator of the credential.
  optional string created_by = 8;
  // Time at which the credential was last changed, in epoch milliseconds.
  int64 updated_at = 9;
  // Username of the user who last changed the credential.
  optional string updated_by = 10;
  // What the credential is used for. Absent when the credential was created without one.
  optional CredentialPurpose purpose = 11;
  // The Azure service principal of the credential.
  AzureServicePrincipalResponse azure_service_principal = 12;
  // The Azure managed identity of the credential.
  AzureManagedIdentity azure_managed_identity = 13;
  // The GCP service account of the credential.
  GcpServiceAccount gcp_service_account = 14;
  // The GCP service account key of the credential.
  GcpServiceAccountKeyResponse gcp_service_account_key = 15;
}

message CreateCredentialRequest {
  // Name of the credential.
  string name = 1 [(google.api.field_behavior) = REQUIRED];
  // User-provided free-form text description.
  optional string comment = 2;
  // The AWS IAM role of the credential. A credential has exactly one of `aws_iam_role`,
  // `azure_service_principal`, `azure_managed_identity`, `gcp_service_account` and
  // `gcp_service_account_key`.
  AwsIamRoleRequest aws_iam_role = 3;
  // What the credential is used for.
  optional CredentialPurpose purpose = 4;
  // The Azure service principal of the credential.
  AzureServicePrincipalRequest azure_service_principal = 5;
  // The Azure managed identity of the credential.
  AzureManagedIdentity azure_managed_identity = 6;
  // The GCP service account of the credential.
  GcpServiceAccount gcp_service_account = 7;
  // The GCP service account key of the credential.
  GcpServiceAccountKeyRequest gcp_service_account_key = 8;
}

message ListCredentialsRequest {
  // The maximum number of credentials to return.
  optional int32 max_results = 1;
  // Opaque token of the page to return: the `next_page_token` of the page before.
  optional string page_token = 2;
  // Return only the credentials with this purpose.
  optional CredentialPurpose purpose = 3;
}

message ListCredentialsResponse {
  // The credentials.
  repeated CredentialInfo credentials = 1;
  // Opaque token of the next page. Absent on the last page.
  optional string next_page_token = 2;
}

message GetCredentialRequest {
  // Name of the credential.
  string name = 1 [(google.api.field_behavior) = REQUIRED];
}

message UpdateCredentialRequest {
  // Name of the credential.
  string name = 1 [(google.api.field_behavior) = REQUIRED];
  // User-provided free-form text description.
  optional string comment = 2;
  // New AWS IAM role of the credential. The role gets a new external ID. Give at most one of
  // `aws_iam_role`, `azure_service_principal`, `azure_managed_identity`, `gcp_service_account`
  // and `gcp_service_account_key`: it replaces the identity of the credential.
  AwsIamRoleRequest aws_iam_role = 3;
  // New name of the credential.
  optional string new_name = 4;
  // New Azure service principal of the credential.
  AzureServicePrincipalRequest azure_service_principal = 5;
  // New Azure managed identity of the credential.
  AzureManagedIdentity azure_managed_identity = 6;
  // New GCP service account of the credential.
  GcpServiceAccount gcp_service_account = 7;
  // New GCP service account key of the credential.
  GcpServiceAccountKeyRequest gcp_service_account_key = 8;
}

message DeleteCredentialRequest {
  // Name of the credential.
  string name = 1 [(google.api.field_behavior) = REQUIRED];
  // Delete the credential even when external locations use it.
  optional bool force = 2;
}

// Temporary AWS credentials.
message AwsCredentials {
  // The access key ID of the temporary credentials.
  string access_key_id = 1;
  // The secret access key of the temporary credentials.
  string secret_access_key = 2 [debug_redact = true];
  // The session token of the temporary credentials.
  string session_token = 3 [debug_redact = true];
}

// A shared access signature (SAS) for Azure storage, signed with a user delegation key.
message AzureUserDelegationSAS {
  // The SAS token.
  string sas_token = 1 [debug_redact = true];
}

// An OAuth token for Google Cloud Storage.
message GcpOauthToken {
  // The OAuth token.
  string oauth_token = 1 [debug_redact = true];
}

// Temporary credentials for the cloud of a storage location.
// Empty for a local `file:` location.
message TemporaryCredentials {
  // Temporary credentials for AWS S3.
  AwsCredentials aws_temp_credentials = 1;
  // A SAS token for Azure storage.
  AzureUserDelegationSAS azure_user_delegation_sas = 2;
  // An OAuth token for Google Cloud Storage.
  GcpOauthToken gcp_oauth_token = 3;
  // Time at which the credentials expire, in epoch milliseconds. Absent when the credentials do
  // not expire.
  optional int64 expiration_time = 4;
  // The storage path that the credentials give access to.
  string url = 5;
}

// The operation on a table that temporary credentials are for.
enum TableOperation {
  TABLE_OPERATION_UNSPECIFIED = 0;
  // The operation is not known.
  UNKNOWN_TABLE_OPERATION = 1;
  // Read the table.
  READ = 2;
  // Read and write the table.
  READ_WRITE = 3;
}

// The operation on a volume that temporary credentials are for.
enum VolumeOperation {
  VOLUME_OPERATION_UNSPECIFIED = 0;
  // The operation is not known.
  UNKNOWN_VOLUME_OPERATION = 1;
  // Read the volume.
  READ_VOLUME = 2;
  // Read and write the volume.
  WRITE_VOLUME = 3;
}

// The operation on a model version that temporary credentials are for.
enum ModelVersionOperation {
  MODEL_VERSION_OPERATION_UNSPECIFIED = 0;
  // The operation is not known. The server rejects it.
  UNKNOWN_MODEL_VERSION_OPERATION = 1;
  // Read the model version.
  READ_MODEL_VERSION = 2;
  // Read and write the model version. Only for a model version with the status
  // PENDING_REGISTRATION.
  READ_WRITE_MODEL_VERSION = 3;
}

// The operation on a storage path that temporary credentials are for.
enum PathOperation {
  PATH_OPERATION_UNSPECIFIED = 0;
  // The operation is not known.
  UNKNOWN_PATH_OPERATION = 1;
  // Read the path.
  PATH_READ = 2;
  // Read and write the path.
  PATH_READ_WRITE = 3;
  // Create a table at the path.
  PATH_CREATE_TABLE = 4;
}

message GenerateTemporaryTableCredential {
  // Unique identifier of the table.
  string table_id = 1 [(google.api.field_behavior) = REQUIRED];
  // The operation on the table.
  TableOperation operation = 2 [(google.api.field_behavior) = REQUIRED];
}

message GenerateTemporaryVolumeCredential {
  // Unique identifier of the volume.
  string volume_id = 1 [(google.api.field_behavior) = REQUIRED];
  // The operation on the volume.
  VolumeOperation operation = 2 [(google.api.field_behavior) = REQUIRED];
}

message GenerateTemporaryModelVersionCredential {
  // Name of the parent catalog.
  string catalog_name = 1 [(google.api.field_behavior) = REQUIRED];
  // Name of the parent schema.
  string schema_name = 2 [(google.api.field_behavior) = REQUIRED];
  // Name of the registered model, relative to its schema.
  string model_name = 3 [(google.api.field_behavior) = REQUIRED];
  // Number of the model version.
  int64 version = 4 [(google.api.field_behavior) = REQUIRED];
  // The operation on the model version.
  ModelVersionOperation operation = 5 [(google.api.field_behavior) = REQUIRED];
}

message GenerateTemporaryPathCredential {
  // URL of the storage path.
  string url = 1 [(google.api.field_behavior) = REQUIRED];
  // The operation on the path.
  PathOperation operation = 2 [(google.api.field_behavior) = REQUIRED];
}

// Credentials: the cloud identities that give the server access to storage.
service CredentialsService {
  // List the credentials that the caller can see.
  rpc ListCredentials(ListCredentialsRequest) returns (ListCredentialsResponse) {
    option (google.api.http) = {get: "/api/2.1/unity-catalog/credentials"};
  }

  // Create a credential.
  rpc CreateCredential(CreateCredentialRequest) returns (CredentialInfo) {
    option (google.api.http) = {
      post: "/api/2.1/unity-catalog/credentials"
      body: "*"
    };
  }

  // Get a credential.
  rpc GetCredential(GetCredentialRequest) returns (CredentialInfo) {
    option (google.api.http) = {get: "/api/2.1/unity-catalog/credentials/{name}"};
  }

  // Change a credential.
  rpc UpdateCredential(UpdateCredentialRequest) returns (CredentialInfo) {
    option (google.api.http) = {
      patch: "/api/2.1/unity-catalog/credentials/{name}"
      body: "*"
    };
  }

  // Delete a credential. A credential that external locations use needs `force`.
  rpc DeleteCredential(DeleteCredentialRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/api/2.1/unity-catalog/credentials/{name}"};
  }
}

// Temporary credentials: short-lived credentials for the storage of a table, volume, model
// version or path, limited to one operation.
service TemporaryCredentialsService {
  // Generate temporary credentials for the storage of a table.
  rpc GenerateTemporaryTableCredentials(GenerateTemporaryTableCredential) returns (TemporaryCredentials) {
    option (google.api.http) = {
      post: "/api/2.1/unity-catalog/temporary-table-credentials"
      body: "*"
    };
  }

  // Generate temporary credentials for the storage of a volume.
  rpc GenerateTemporaryVolumeCredentials(GenerateTemporaryVolumeCredential) returns (TemporaryCredentials) {
    option (google.api.http) = {
      post: "/api/2.1/unity-catalog/temporary-volume-credentials"
      body: "*"
    };
  }

  // Generate temporary credentials for a storage path.
  rpc GenerateTemporaryPathCredentials(GenerateTemporaryPathCredential) returns (TemporaryCredentials) {
    option (google.api.http) = {
      post: "/api/2.1/unity-catalog/temporary-path-credentials"
      body: "*"
    };
  }

  // Generate temporary credentials for the storage of a model version.
  rpc GenerateTemporaryModelVersionCredentials(GenerateTemporaryModelVersionCredential) returns (TemporaryCredentials) {
    option (google.api.http) = {
      post: "/api/2.1/unity-catalog/temporary-model-version-credentials"
      body: "*"
    };
  }
}
