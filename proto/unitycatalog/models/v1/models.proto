syntax = "proto3";

package unitycatalog.models.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/empty.proto";
import "olai/trestle/v1/annotations.proto";

// A registered model: a securable in the three-level namespace (catalog.schema.model) that
// holds model versions.
message RegisteredModelInfo {
  option (google.api.resource) = {
    type: "unitycatalog.io/RegisteredModel"
    pattern: "models/{registered_model}"
    plural: "registered_models"
    singular: "registered_model"
  };

  // Name of the registered model, relative to its schema.
  string name = 1;
  // Name of the parent catalog.
  string catalog_name = 2;
  // Name of the parent schema.
  string schema_name = 3;
  // Storage location under which the model versions keep their files.
  string storage_location = 4;
  // Three-level name of the registered model: `catalog.schema.model`.
  string full_name = 5 [(google.api.field_behavior) = IDENTIFIER];
  // User-provided free-form text description.
  optional string comment = 6;
  // Username of the owner of the registered model.
  optional string owner = 7;
  // Time at which the registered model was created, in epoch milliseconds.
  int64 created_at = 8;
  // Username of the creator of the registered model.
  optional string created_by = 9;
  // Time at which the registered model was last changed, in epoch milliseconds.
  int64 updated_at = 10;
  // Username of the user who last changed the registered model.
  optional string updated_by = 11;
  // Unique identifier of the registered model.
  string id = 12;
}

message CreateRegisteredModel {
  // Name of the registered model, relative to its schema.
  string name = 1 [(google.api.field_behavior) = REQUIRED];
  // Name of the parent catalog.
  string catalog_name = 2 [(google.api.field_behavior) = REQUIRED];
  // Name of the parent schema.
  string schema_name = 3 [(google.api.field_behavior) = REQUIRED];
  // User-provided free-form text description.
  optional string comment = 4;
}

message ListRegisteredModelsRequest {
  // Name of the catalog whose registered models to return.
  optional string catalog_name = 1;
  // Name of the schema whose registered models to return.
  optional string schema_name = 2;
  // The maximum number of registered models to return.
  optional int32 max_results = 3;
  // Opaque token of the page to return: the `next_page_token` of the page before.
  optional string page_token = 4;
}

message ListRegisteredModelsResponse {
  // The registered models.
  repeated RegisteredModelInfo registered_models = 1;
  // Opaque token of the next page. Absent on the last page.
  optional string next_page_token = 2;
}

message GetRegisteredModelRequest {
  // Three-level name of the registered model: `catalog.schema.model`.
  string full_name = 1 [(google.api.field_behavior) = REQUIRED];
}

message UpdateRegisteredModel {
  // Three-level name of the registered model: `catalog.schema.model`.
  string full_name = 1 [(google.api.field_behavior) = REQUIRED];
  // User-provided free-form text description.
  optional string comment = 2;
  // New name of the registered model, relative to its schema.
  optional string new_name = 3;
}

message DeleteRegisteredModelRequest {
  // Three-level name of the registered model: `catalog.schema.model`.
  string full_name = 1 [(google.api.field_behavior) = REQUIRED];
  // Delete the model versions of the registered model too.
  optional bool force = 2;
}

// The status of a model version: where the upload of its files stands.
enum ModelVersionStatus {
  MODEL_VERSION_STATUS_UNSPECIFIED = 0;
  // The status is not known.
  MODEL_VERSION_STATUS_UNKNOWN = 1;
  // The client has not yet written all files of the model version. A new model version has this
  // status.
  PENDING_REGISTRATION = 2;
  // The client failed to write all files of the model version.
  FAILED_REGISTRATION = 3;
  // The client wrote all files and finalized the model version.
  READY = 4;
}

// A version of a registered model. The server gives each new version the next number.
message ModelVersionInfo {
  option (google.api.resource) = {
    type: "unitycatalog.io/ModelVersion"
    pattern: "model_versions/{model_version}"
    plural: "model_versions"
    singular: "model_version"
  };

  // Name of the parent registered model, relative to its schema.
  string model_name = 1;
  // Name of the parent catalog.
  string catalog_name = 2;
  // Name of the parent schema.
  string schema_name = 3;
  // Number of the model version.
  int64 version = 4;
  // URI of the source files the model version was created from, such as an MLflow run
  // artifact path.
  string source = 5;
  // ID of the run of the ML package that made the model.
  optional string run_id = 6;
  // Status of the model version.
  ModelVersionStatus status = 7;
  // Storage location of the files of the model version.
  string storage_location = 8;
  // User-provided free-form text description.
  optional string comment = 9;
  // Time at which the model version was created, in epoch milliseconds.
  int64 created_at = 10;
  // Username of the creator of the model version.
  optional string created_by = 11;
  // Time at which the model version was last changed, in epoch milliseconds.
  int64 updated_at = 12;
  // Username of the user who last changed the model version.
  optional string updated_by = 13;
  // Unique identifier of the model version.
  string id = 14;
}

message CreateModelVersion {
  // Name of the parent registered model, relative to its schema.
  string model_name = 1 [(google.api.field_behavior) = REQUIRED];
  // Name of the parent catalog.
  string catalog_name = 2 [(google.api.field_behavior) = REQUIRED];
  // Name of the parent schema.
  string schema_name = 3 [(google.api.field_behavior) = REQUIRED];
  // URI of the source files the model version is created from, such as an MLflow run artifact
  // path.
  string source = 4 [(google.api.field_behavior) = REQUIRED];
  // ID of the run of the ML package that made the model.
  optional string run_id = 5;
  // User-provided free-form text description.
  optional string comment = 6;
}

message ListModelVersionsRequest {
  // Three-level name of the registered model: `catalog.schema.model`.
  string full_name = 1 [(google.api.field_behavior) = REQUIRED];
  // The maximum number of model versions to return.
  optional int32 max_results = 2;
  // Opaque token of the page to return: the `next_page_token` of the page before.
  optional string page_token = 3;
}

message ListModelVersionsResponse {
  // The model versions.
  repeated ModelVersionInfo model_versions = 1;
  // Opaque token of the next page. Absent on the last page.
  optional string next_page_token = 2;
}

message GetModelVersionRequest {
  // Three-level name of the registered model: `catalog.schema.model`.
  string full_name = 1 [(google.api.field_behavior) = REQUIRED];
  // Number of the model version.
  int64 version = 2 [(google.api.field_behavior) = REQUIRED];
}

message UpdateModelVersion {
  // Three-level name of the registered model: `catalog.schema.model`.
  string full_name = 1 [(google.api.field_behavior) = REQUIRED];
  // Number of the model version.
  int64 version = 2 [(google.api.field_behavior) = REQUIRED];
  // User-provided free-form text description. The comment is the only field that can change; an
  // empty one clears it.
  string comment = 3 [
    (google.api.field_behavior) = REQUIRED,
    (olai.trestle.v1.emit_unpopulated) = true
  ];
}

message DeleteModelVersionRequest {
  // Three-level name of the registered model: `catalog.schema.model`.
  string full_name = 1 [(google.api.field_behavior) = REQUIRED];
  // Number of the model version.
  int64 version = 2 [(google.api.field_behavior) = REQUIRED];
}

message FinalizeModelVersion {
  // Three-level name of the registered model: `catalog.schema.model`.
  string full_name = 1 [(google.api.field_behavior) = REQUIRED];
  // Number of the model version.
  int64 version = 2 [(google.api.field_behavior) = REQUIRED];
}

// Registered models: the models of the three-level namespace, which hold model versions.
service RegisteredModelsService {
  // List the registered models that the caller can see, of a catalog or schema when given.
  rpc ListRegisteredModels(ListRegisteredModelsRequest) returns (ListRegisteredModelsResponse) {
    option (google.api.http) = {get: "/api/2.1/unity-catalog/models"};
  }

  // Create a registered model.
  rpc CreateRegisteredModel(.unitycatalog.models.v1.CreateRegisteredModel) returns (RegisteredModelInfo) {
    option (google.api.http) = {
      post: "/api/2.1/unity-catalog/models"
      body: "*"
    };
  }

  // Get a registered model.
  rpc GetRegisteredModel(GetRegisteredModelRequest) returns (RegisteredModelInfo) {
    option (google.api.http) = {get: "/api/2.1/unity-catalog/models/{full_name}"};
  }

  // Change a registered model.
  rpc UpdateRegisteredModel(.unitycatalog.models.v1.UpdateRegisteredModel) returns (RegisteredModelInfo) {
    option (google.api.http) = {
      patch: "/api/2.1/unity-catalog/models/{full_name}"
      body: "*"
    };
  }

  // Delete a registered model. A model with versions needs `force`.
  rpc DeleteRegisteredModel(DeleteRegisteredModelRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/api/2.1/unity-catalog/models/{full_name}"};
  }
}

// Model versions: the versions of a registered model, each with its own files.
service ModelVersionsService {
  // List the versions of a registered model.
  rpc ListModelVersions(ListModelVersionsRequest) returns (ListModelVersionsResponse) {
    option (google.api.http) = {get: "/api/2.1/unity-catalog/models/{full_name}/versions"};
  }

  // Create a model version with the status PENDING_REGISTRATION. The server gives it the next
  // version number and a storage location.
  rpc CreateModelVersion(.unitycatalog.models.v1.CreateModelVersion) returns (ModelVersionInfo) {
    option (google.api.http) = {
      post: "/api/2.1/unity-catalog/models/versions"
      body: "*"
    };
  }

  // Get a model version.
  rpc GetModelVersion(GetModelVersionRequest) returns (ModelVersionInfo) {
    option (google.api.http) = {get: "/api/2.1/unity-catalog/models/{full_name}/versions/{version}"};
  }

  // Change a model version.
  rpc UpdateModelVersion(.unitycatalog.models.v1.UpdateModelVersion) returns (ModelVersionInfo) {
    option (google.api.http) = {
      patch: "/api/2.1/unity-catalog/models/{full_name}/versions/{version}"
      body: "*"
    };
  }

  // Delete a model version.
  rpc DeleteModelVersion(DeleteModelVersionRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/api/2.1/unity-catalog/models/{full_name}/versions/{version}"};
  }

  // Finalize a model version: its status changes from PENDING_REGISTRATION to READY after the
  // client wrote all its files.
  rpc FinalizeModelVersion(.unitycatalog.models.v1.FinalizeModelVersion) returns (ModelVersionInfo) {
    option (google.api.http) = {
      patch: "/api/2.1/unity-catalog/models/{full_name}/versions/{version}/finalize"
      body: "*"
    };
  }
}
