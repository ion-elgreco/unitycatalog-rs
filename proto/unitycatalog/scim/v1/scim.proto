syntax = "proto3";

package unitycatalog.scim.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";
import "olai/trestle/v1/annotations.proto";

// No message here is a `google.api.resource`: in the service of a resource, `GetMe`, `ScimBulk`
// and `GetServiceProviderConfig` (no path parameter) are on neither the root client nor the
// resource client, and a SCIM list, which pages by `startIndex` and `count`, either gets an
// `into_stream` that needs `page_token` (standard `List`) or is missing from the Python root client
// (custom `List*`).

// The SCIM `meta` of a resource: its type and when it was created and last changed.
message ScimMeta {
  // The SCIM resource type, such as `User`.
  string resource_type = 1;
  // Time at which the resource was created, in RFC 3339.
  optional string created = 2;
  // Time at which the resource was last changed, in RFC 3339.
  optional string last_modified = 3;
  // URL of the resource, such as `https://uc.example.com/api/1.0/unity-control/scim2/Users/<id>`.
  optional string location = 4;
}

// A SCIM role of a user.
message ScimRole {
  // The role, such as `admin`.
  string value = 1;
}

// A picture of a user.
message ScimPhoto {
  // URL of the picture. Empty when the user has no picture.
  string value = 1 [
    (google.api.field_behavior) = REQUIRED,
    (olai.trestle.v1.emit_unpopulated) = true
  ];
  // Kind of the picture: `photo` or `thumbnail`.
  optional string photo_type = 2 [json_name = "type"];
  // Whether this is the primary picture of the user.
  optional bool primary = 3;
  // A name for the picture, for display.
  optional string display = 4;
}

// An email address of a user.
message ScimEmail {
  // The email address.
  string value = 1 [
    (google.api.field_behavior) = REQUIRED,
    (olai.trestle.v1.emit_unpopulated) = true
  ];
  // Whether this is the primary email address of the user.
  optional bool primary = 2;
  // Kind of the address: `work`, `home` or `other`.
  optional string email_type = 3 [json_name = "type"];
  // A name for the address, for display.
  optional string display = 4;
}

// The parts of the name of a user.
message ScimName {
  // The full name, formatted for display.
  optional string formatted = 1;
  // The family name, or last name.
  optional string family_name = 2;
  // The given name, or first name.
  optional string given_name = 3;
  // The middle name.
  optional string middle_name = 4;
  // The honorific prefix, such as `Ms.`.
  optional string honorific_prefix = 5;
  // The honorific suffix, such as `III`.
  optional string honorific_suffix = 6;
}

// A SCIM 2.0 user. Its principal, its name in grants and owners, is its primary email, else its
// first email, else its user name.
message ScimUser {
  // SCIM schema URIs of the resource: `urn:ietf:params:scim:schemas:core:2.0:User`.
  repeated string schemas = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Unique identifier of the user.
  string id = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The identity the user has at an identity provider. An application's own token names the user
  // whose external id is the name of the issuer block and the client id, such as
  // `entra:<client id>`.
  optional string external_id = 3;
  // When the user was created and last changed.
  ScimMeta meta = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The unique name of the user, such as a user principal name, in any case. Absent in a create
  // request: the principal.
  string user_name = 5;
  // Name of the user, for display.
  optional string display_name = 6;
  // Whether the user can sign in. Absent: enabled; a new user without it gets `true`.
  optional bool active = 7;
  // Email addresses of the user. When the principal changes, the grants, owned objects and
  // tokens of the user move to the new one.
  repeated ScimEmail emails = 8;
  // Pictures of the user.
  repeated ScimPhoto photos = 9;
  // Roles of the user. Only `/scim2/Me` sends them: the role `admin` for a caller that can do
  // what the metastore admin does. The server ignores roles in requests.
  repeated ScimRole roles = 10 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The parts of the name of the user.
  ScimName name = 11;
}

message ListUsersRequest {
  // SCIM filter (RFC 7644, section 3.4.2.2), such as `userName eq "a@example.com"`.
  optional string filter = 1;
  // Index of the first user to return, from 1.
  optional int32 start_index = 2;
  // The maximum number of users to return, at most 1000. The default is 50.
  optional int32 count = 3;
  // The only attributes to return, separated by commas, such as `userName,emails.value`.
  optional string attributes = 4;
  // The attributes to leave out, separated by commas, such as `emails`.
  optional string excluded_attributes = 5;
}

// A page of SCIM users.
message ListScimUsersResponse {
  // SCIM schema URIs of the response: `urn:ietf:params:scim:api:messages:2.0:ListResponse`.
  repeated string schemas = 1;
  // Number of users that match.
  int32 total_results = 2;
  // The users.
  repeated ScimUser resources = 3 [json_name = "Resources"];
  // Index of the first user of the page, from 1.
  int32 start_index = 4;
  // Number of users in the page.
  int32 items_per_page = 5;
}

// A page of SCIM users and groups.
message ListScimResourcesResponse {
  // SCIM schema URIs of the response: `urn:ietf:params:scim:api:messages:2.0:ListResponse`.
  repeated string schemas = 1;
  // Number of resources that match.
  int32 total_results = 2;
  // The users and groups.
  repeated google.protobuf.Struct resources = 3 [json_name = "Resources"];
  // Index of the first resource of the page, from 1.
  int32 start_index = 4;
  // Number of resources in the page.
  int32 items_per_page = 5;
}

// A SCIM search (RFC 7644, section 3.4.3): a list request in a body.
message ScimSearchRequest {
  // SCIM schema URIs of the request: `urn:ietf:params:scim:api:messages:2.0:SearchRequest`.
  repeated string schemas = 1;
  // The only attributes to return, such as `userName`.
  repeated string attributes = 2;
  // The attributes to leave out.
  repeated string excluded_attributes = 3;
  // SCIM filter (RFC 7644, section 3.4.2.2).
  optional string filter = 4;
  // Index of the first resource to return, from 1.
  optional int32 start_index = 5;
  // The maximum number of resources to return, at most 1000. The default is 50.
  optional int32 count = 6;
}

message GetUserRequest {
  // Unique identifier of the user.
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  // The only attributes to return, separated by commas.
  optional string attributes = 2;
  // The attributes to leave out, separated by commas.
  optional string excluded_attributes = 3;
}

message DeleteUserRequest {
  // Unique identifier of the user.
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

message GetMeRequest {}

// A member of a SCIM group.
message ScimGroupMember {
  // The `id` of the user.
  string value = 1 [
    (google.api.field_behavior) = REQUIRED,
    (olai.trestle.v1.emit_unpopulated) = true
  ];
  // A display string, which clients set to the name of the user.
  optional string display = 2;
  // The SCIM resource type of the member: `User`.
  optional string member_type = 3 [json_name = "type"];
  // URL of the user. The server sets it and ignores it in requests.
  optional string ref = 4 [json_name = "$ref"];
}

// A SCIM 2.0 group of users.
message ScimGroup {
  // SCIM schema URIs of the resource: `urn:ietf:params:scim:schemas:core:2.0:Group`. Requests
  // send the key even when empty; the server fills it in.
  repeated string schemas = 1 [(olai.trestle.v1.emit_unpopulated) = true];
  // Unique identifier of the group. The server assigns it.
  string id = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Name of the group, its name in grants.
  string display_name = 3 [
    (google.api.field_behavior) = REQUIRED,
    (olai.trestle.v1.emit_unpopulated) = true
  ];
  // Members of the group: users.
  repeated ScimGroupMember members = 4;
  // The identity the group has at an identity provider.
  optional string external_id = 5;
  // When the group was created and last changed.
  ScimMeta meta = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message ListGroupsRequest {
  // SCIM filter (RFC 7644, section 3.4.2.2), such as `displayName eq "admins"`.
  optional string filter = 1;
  // Index of the first group to return, from 1.
  optional int32 start_index = 2;
  // The maximum number of groups to return, at most 1000. The default is 50.
  optional int32 count = 3;
  // The only attributes to return, separated by commas, such as `displayName`.
  optional string attributes = 4;
  // The attributes to leave out, separated by commas, such as `members`.
  optional string excluded_attributes = 5;
}

// A page of SCIM groups.
message ListScimGroupsResponse {
  // SCIM schema URIs of the response: `urn:ietf:params:scim:api:messages:2.0:ListResponse`.
  repeated string schemas = 1;
  // Number of groups that match.
  int32 total_results = 2;
  // The groups.
  repeated ScimGroup resources = 3 [json_name = "Resources"];
  // Index of the first group of the page, from 1.
  int32 start_index = 4;
  // Number of groups in the page.
  int32 items_per_page = 5;
}

message GetGroupRequest {
  // Unique identifier of the group.
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  // The only attributes to return, separated by commas.
  optional string attributes = 2;
  // The attributes to leave out, separated by commas.
  optional string excluded_attributes = 3;
}

message DeleteGroupRequest {
  // Unique identifier of the group.
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

// One operation of a SCIM PATCH request (RFC 7644, section 3.5.2).
message ScimPatchOperation {
  // The operation: `add`, `remove` or `replace`, in any case.
  string op = 1 [
    (google.api.field_behavior) = REQUIRED,
    (olai.trestle.v1.emit_unpopulated) = true
  ];
  // SCIM attribute path: `attr`, `attr.sub`, `attr[filter]` or `attr[filter].sub`, such as
  // `name.familyName`, `members[value eq "<id>"]` or `emails[type eq "work"].value`. Absent for
  // an `add` or `replace` whose `value` holds the attributes.
  optional string path = 2;
  // The value. Any JSON: a string for `displayName`, an array of members for `members`, an
  // object of attributes without `path`. A `remove` of a list with a value removes those values.
  optional google.protobuf.Value value = 3;
}

// A SCIM PATCH request (RFC 7644, section 3.5.2) for the user or group `id`.
message ScimPatchOp {
  // Unique identifier of the user or group.
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  // SCIM schema URIs of the request: `urn:ietf:params:scim:api:messages:2.0:PatchOp`.
  repeated string schemas = 2;
  // The operations, in order.
  repeated ScimPatchOperation operations = 3 [
    json_name = "Operations",
    (google.api.field_behavior) = REQUIRED,
    (olai.trestle.v1.emit_unpopulated) = true
  ];
}

// One operation of a SCIM bulk request (RFC 7644, section 3.7).
message ScimBulkOp {
  // The HTTP method of the operation: `POST`, `PUT`, `PATCH` or `DELETE`.
  string method = 1 [
    (google.api.field_behavior) = REQUIRED,
    (olai.trestle.v1.emit_unpopulated) = true
  ];
  // The resource of the operation: `/Users` or `/Groups` for `POST`, `/Users/<id>` or
  // `/Groups/<id>` for the others.
  string path = 2 [
    (google.api.field_behavior) = REQUIRED,
    (olai.trestle.v1.emit_unpopulated) = true
  ];
  // Identifier of the operation, which the result repeats.
  optional string bulk_id = 3;
  // The body of the operation: a `ScimUser` or `ScimGroup` for `POST` and `PUT`, a `ScimPatchOp`
  // (without `id`) for `PATCH`.
  optional google.protobuf.Struct data = 4;
}

// A SCIM bulk request (RFC 7644, section 3.7): operations on users and groups in one request.
message ScimBulkRequest {
  // SCIM schema URIs of the request: `urn:ietf:params:scim:api:messages:2.0:BulkRequest`.
  repeated string schemas = 1;
  // Stop after this many operations failed. Absent: run every operation.
  optional int32 fail_on_errors = 2;
  // The operations, in order. At most 100.
  repeated ScimBulkOp operations = 3 [json_name = "Operations"];
}

// The result of one operation of a SCIM bulk request.
message ScimBulkOpResult {
  // The HTTP method of the operation.
  string method = 1;
  // The HTTP status of the operation, such as `201`.
  string status = 2;
  // The `bulk_id` of the operation.
  optional string bulk_id = 3;
  // Path of the resource that the operation created or changed, such as `/scim2/Users/<id>`.
  optional string location = 4;
  // The SCIM error of a failed operation.
  optional google.protobuf.Struct response = 5;
}

// The answer to a SCIM bulk request: one result per operation that ran, in order.
message ScimBulkResponse {
  // SCIM schema URIs of the response: `urn:ietf:params:scim:api:messages:2.0:BulkResponse`.
  repeated string schemas = 1;
  // The results of the operations.
  repeated ScimBulkOpResult operations = 2 [json_name = "Operations"];
}

// An attribute of a SCIM schema (RFC 7643, section 7).
message ScimSchemaAttribute {
  // Name of the attribute, such as `userName`.
  string name = 1;
  // Data type of the attribute: `string`, `boolean`, `reference` or `complex`.
  string type = 2;
  // Whether a resource must have the attribute.
  bool required = 3;
  // Whether the attribute holds a list of values.
  optional bool multi_valued = 4;
  // How the server keeps values unique: `none` or `server`.
  optional string uniqueness = 5;
  // The attributes of a `complex` attribute.
  repeated ScimSchemaAttribute sub_attributes = 6;
  // Description of the attribute.
  optional string description = 7;
  // Whether text values compare with their case: never.
  optional bool case_exact = 8;
  // Whether a client may change the attribute: `readOnly`, `readWrite` or `immutable`.
  optional string mutability = 9;
  // When the server returns the attribute: `default`.
  optional string returned = 10;
  // The values that the attribute usually has, such as `work` and `home`.
  repeated string canonical_values = 11;
  // What a `reference` attribute refers to, such as `external`.
  repeated string reference_types = 12;
}

// A SCIM schema (RFC 7643, section 7).
message ScimSchema {
  // SCIM schema URIs of the resource: `urn:ietf:params:scim:schemas:core:2.0:Schema`.
  repeated string schemas = 1;
  // URI of the schema, such as `urn:ietf:params:scim:schemas:core:2.0:User`.
  string id = 2;
  // Name of the schema, such as `User`.
  string name = 3;
  // Description of the schema.
  string description = 4;
  // The attributes of the schema.
  repeated ScimSchemaAttribute attributes = 5;
  // The type and path of the schema.
  ScimMeta meta = 6;
}

message ListScimSchemasRequest {}

message GetScimSchemaRequest {
  // URI of the schema, such as `urn:ietf:params:scim:schemas:core:2.0:User`.
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

// The SCIM schemas of the server, User and Group, as a SCIM list (RFC 7644, section 4).
message ListScimSchemasResponse {
  // SCIM schema URIs of the response: `urn:ietf:params:scim:api:messages:2.0:ListResponse`.
  repeated string schemas = 1;
  // Number of schemas.
  int32 total_results = 2;
  // The schemas.
  repeated ScimSchema resources = 3 [json_name = "Resources"];
  // Index of the first schema: 1.
  int32 start_index = 4;
  // Number of schemas.
  int32 items_per_page = 5;
}

// A SCIM resource type (RFC 7643, section 6).
message ScimResourceType {
  // SCIM schema URIs of the resource: `urn:ietf:params:scim:schemas:core:2.0:ResourceType`.
  repeated string schemas = 1;
  // Identifier of the resource type, such as `User`.
  string id = 2;
  // Name of the resource type, such as `User`.
  string name = 3;
  // Path of the resources, relative to `/scim2`, such as `/Users`.
  string endpoint = 4;
  // Description of the resource type.
  string description = 5;
  // URI of the schema of the resources, such as `urn:ietf:params:scim:schemas:core:2.0:User`.
  string schema = 6;
  // The type and path of the resource type.
  ScimMeta meta = 7;
}

message ListScimResourceTypesRequest {}

message GetScimResourceTypeRequest {
  // Identifier of the resource type: `User` or `Group`.
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

// The SCIM resource types of the server, User and Group, as a SCIM list (RFC 7644, section 4).
message ListScimResourceTypesResponse {
  // SCIM schema URIs of the response: `urn:ietf:params:scim:api:messages:2.0:ListResponse`.
  repeated string schemas = 1;
  // Number of resource types.
  int32 total_results = 2;
  // The resource types.
  repeated ScimResourceType resources = 3 [json_name = "Resources"];
  // Index of the first resource type: 1.
  int32 start_index = 4;
  // Number of resource types.
  int32 items_per_page = 5;
}

// Whether the server supports a SCIM feature.
message ScimSupported {
  // Whether the feature is supported.
  bool supported = 1;
}

// How the server supports SCIM bulk requests.
message ScimBulkConfig {
  // Whether bulk requests are supported.
  bool supported = 1;
  // The maximum number of operations in a bulk request.
  int32 max_operations = 2;
  // The maximum size of a bulk request, in bytes.
  int32 max_payload_size = 3;
}

// How the server supports SCIM filters.
message ScimFilterConfig {
  // Whether filters are supported.
  bool supported = 1;
  // The maximum number of resources in an answer.
  int32 max_results = 2;
}

// A way to authenticate to the SCIM endpoints.
message ScimAuthenticationScheme {
  // Kind of the scheme: `oauthbearertoken`.
  string type = 1;
  // Name of the scheme.
  string name = 2;
  // Description of the scheme.
  string description = 3;
  // Whether this is the preferred scheme.
  bool primary = 4;
  // URL of the specification of the scheme.
  optional string spec_uri = 5;
}

message GetServiceProviderConfigRequest {}

// The SCIM features that the server supports (RFC 7643, section 5).
message ScimServiceProviderConfig {
  // SCIM schema URIs of the resource:
  // `urn:ietf:params:scim:schemas:core:2.0:ServiceProviderConfig`.
  repeated string schemas = 1;
  // PATCH requests.
  ScimSupported patch = 2;
  // Bulk requests.
  ScimBulkConfig bulk = 3;
  // Filters.
  ScimFilterConfig filter = 4;
  // Password changes.
  ScimSupported change_password = 5;
  // Sorting.
  ScimSupported sort = 6;
  // ETags.
  ScimSupported etag = 7;
  // The ways to authenticate.
  repeated ScimAuthenticationScheme authentication_schemes = 8;
  // The type and path of the resource.
  ScimMeta meta = 9;
  // URL of the documentation of the server's SCIM support.
  optional string documentation_uri = 10;
}

// SCIM 2.0 users and groups, and the signed-in user.
service ScimService {
  // List the users. Only the metastore admin can.
  rpc ListUsers(ListUsersRequest) returns (ListScimUsersResponse) {
    option (google.api.http) = {get: "/api/1.0/unity-control/scim2/Users"};
  }

  // List the users with a search request in the body. Only the metastore admin can.
  rpc SearchUsers(ScimSearchRequest) returns (ListScimUsersResponse) {
    option (google.api.http) = {
      post: "/api/1.0/unity-control/scim2/Users/.search"
      body: "*"
    };
  }

  // Create a user. Its user name, principal and external id belong to no other user, and no group
  // has its principal as name. Only the metastore admin can.
  rpc CreateUser(ScimUser) returns (ScimUser) {
    option (google.api.http) = {
      post: "/api/1.0/unity-control/scim2/Users"
      body: "*"
    };
  }

  // Get a user. Only the metastore admin can.
  rpc GetUser(GetUserRequest) returns (ScimUser) {
    option (google.api.http) = {get: "/api/1.0/unity-control/scim2/Users/{id}"};
  }

  // Replace the attributes of a user that the body has: a value replaces, `null` removes, an
  // absent attribute stays. The body needs `userName`. Only the metastore admin can.
  rpc ReplaceUser(ScimUser) returns (ScimUser) {
    option (google.api.http) = {
      put: "/api/1.0/unity-control/scim2/Users/{id}"
      body: "*"
    };
  }

  // Change a user with `add`, `replace` and `remove` operations (RFC 7644, section 3.5.2).
  // Operations on attributes that the server does not keep change nothing; `userName` cannot be
  // removed. Only the metastore admin can.
  rpc PatchUser(ScimPatchOp) returns (ScimUser) {
    option (google.api.http) = {
      patch: "/api/1.0/unity-control/scim2/Users/{id}"
      body: "*"
    };
  }

  // Delete a user with its grants, tokens and group memberships. Only the metastore admin can.
  rpc DeleteUser(DeleteUserRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/api/1.0/unity-control/scim2/Users/{id}"};
  }

  // Get the signed-in user. The role `admin` names a caller that can do what the metastore admin
  // does.
  rpc GetMe(GetMeRequest) returns (ScimUser) {
    option (google.api.http) = {get: "/api/1.0/unity-control/scim2/Me"};
  }

  // List the groups. Only the metastore admin can.
  rpc ListGroups(ListGroupsRequest) returns (ListScimGroupsResponse) {
    option (google.api.http) = {get: "/api/1.0/unity-control/scim2/Groups"};
  }

  // List the groups with a search request in the body. Only the metastore admin can.
  rpc SearchGroups(ScimSearchRequest) returns (ListScimGroupsResponse) {
    option (google.api.http) = {
      post: "/api/1.0/unity-control/scim2/Groups/.search"
      body: "*"
    };
  }

  // Create a group. Only the metastore admin can.
  rpc CreateGroup(ScimGroup) returns (ScimGroup) {
    option (google.api.http) = {
      post: "/api/1.0/unity-control/scim2/Groups"
      body: "*"
    };
  }

  // Get a group. Only the metastore admin can.
  rpc GetGroup(GetGroupRequest) returns (ScimGroup) {
    option (google.api.http) = {get: "/api/1.0/unity-control/scim2/Groups/{id}"};
  }

  // Replace the attributes of a group that the body has: a value replaces, `null` removes, an
  // absent attribute stays. The body needs `displayName`. A renamed group keeps its grants. Only
  // the metastore admin can.
  rpc ReplaceGroup(ScimGroup) returns (ScimGroup) {
    option (google.api.http) = {
      put: "/api/1.0/unity-control/scim2/Groups/{id}"
      body: "*"
    };
  }

  // Change a group with `add`, `replace` and `remove` operations (RFC 7644, section 3.5.2), such
  // as an `add` to `members` or a `remove` of `members[value eq "<id>"]`. Only the metastore admin
  // can.
  rpc PatchGroup(ScimPatchOp) returns (ScimGroup) {
    option (google.api.http) = {
      patch: "/api/1.0/unity-control/scim2/Groups/{id}"
      body: "*"
    };
  }

  // Delete a group. Only the metastore admin can.
  rpc DeleteGroup(DeleteGroupRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/api/1.0/unity-control/scim2/Groups/{id}"};
  }

  // List the users and the groups with a search request in the body. Only the metastore admin
  // can.
  rpc SearchResources(ScimSearchRequest) returns (ListScimResourcesResponse) {
    option (google.api.http) = {
      post: "/api/1.0/unity-control/scim2/.search"
      body: "*"
    };
  }

  // Run operations on users and groups in one request. Each operation has its own status. Only
  // the metastore admin can.
  rpc ScimBulk(ScimBulkRequest) returns (ScimBulkResponse) {
    option (google.api.http) = {
      post: "/api/1.0/unity-control/scim2/Bulk"
      body: "*"
    };
  }

  // List the SCIM schemas of the server: User and Group. Any signed-in caller can.
  rpc ListScimSchemas(ListScimSchemasRequest) returns (ListScimSchemasResponse) {
    option (google.api.http) = {get: "/api/1.0/unity-control/scim2/Schemas"};
  }

  // Get a SCIM schema of the server. Any signed-in caller can.
  rpc GetScimSchema(GetScimSchemaRequest) returns (ScimSchema) {
    option (google.api.http) = {get: "/api/1.0/unity-control/scim2/Schemas/{id}"};
  }

  // List the SCIM resource types of the server: User and Group. Any signed-in caller can.
